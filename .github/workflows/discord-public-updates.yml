name: BirdShop brief public Discord update

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  public-update:
    name: Post short customer-facing release note
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'major-update')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Announce only approved public bullet points
        env:
          DISCORD_PUBLIC_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_PUBLIC_UPDATES_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              pr = json.load(f)["pull_request"]

          # The private channel can show detailed PR notes. The public channel
          # reads ONLY the explicitly authored Public Update section.
          notes = []
          in_section = False
          for line in (pr.get("body") or "").splitlines():
              if re.match(r"^#{2,3}\s+Public Update\s*$", line, re.I):
                  in_section = True
                  continue
              if in_section and re.match(r"^#{1,3}\s+", line):
                  break
              if in_section:
                  match = re.match(r"^\s*[-*]\s+(.+?)\s*$", line)
                  if match:
                      note = re.sub(r"\s+", " ", match.group(1)).replace("@", "＠")
                      notes.append(note[:170])
                      if len(notes) == 3:
                          break

          if not notes:
              print("No approved ## Public Update bullets; no public message sent.")
              raise SystemExit(0)

          webhook = os.environ.get("DISCORD_PUBLIC_UPDATES_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit(
                  "Missing DISCORD_PUBLIC_UPDATES_WEBHOOK_URL secret. "
                  "Create a separate webhook in the PUBLIC updates channel."
              )
          u = urlparse(webhook)
          if (
              u.scheme != "https"
              or u.hostname not in ("discord.com", "discordapp.com")
              or not re.match(r"^/api/webhooks/\d+/[^/]+/?$", u.path)
          ):
              raise SystemExit("Invalid public Discord webhook URL. Copy the URL from Discord Integrations.")

          payload = {
              "username": "BirdShop Updates",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "BirdShop • Update",
                  "description": "\n".join("• " + n for n in notes),
                  "url": "https://birdshop.store",
                  "color": 0x921027,
                  "footer": {"text": "BirdShop • Release notes • Availability may vary by rollout"}
              }]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BirdShop-Public-Updates/1.0"
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise SystemExit(f"Unexpected Discord response: HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Public Discord update failed: HTTP {exc.code}")
          except urllib.error.URLError:
              raise SystemExit("Public Discord update failed: connection error.")

          print("Short public changelog posted.")
          PY
