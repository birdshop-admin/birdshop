name: BirdShop one-time public updates introduction

on:
  push:
    branches:
      - ops/public-discord-intro-20261117
    paths:
      - .github/workflows/public-discord-intro-20261117.yml

permissions:
  contents: read

jobs:
  post-public-intro:
    name: Post initial brief public update
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Announce recent website updates in public channel
        env:
          DISCORD_PUBLIC_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_PUBLIC_UPDATES_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ.get("DISCORD_PUBLIC_UPDATES_WEBHOOK_URL", "").strip()
          if not url:
              raise SystemExit("DISCORD_PUBLIC_UPDATES_WEBHOOK_URL secret is missing.")
          parsed = urlparse(url)
          if (parsed.scheme != "https"
              or parsed.hostname not in ("discord.com", "discordapp.com")
              or not re.fullmatch(r"/api/webhooks/\d+/[^/]+/?", parsed.path)):
              raise SystemExit("Public Discord webhook URL is not valid; check the GitHub Actions secret.")

          payload = {
              "username": "BirdShop Updates",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": "BIRDSHOP | WEBSITE UPDATE",
                  "description": "**BIRDSHOP | WEBSITE UPDATE**\nNovember 2026\n\nWe've been working on major improvements to BirdShop, focusing on design, shopping, accessibility, and future marketplace expansion.\n\n━━━━━━━━━━━━━━━━━━━━\n**WEBSITE REDESIGN**\nUpdates added to the website code:\n• Refreshed black, ivory, and burgundy storefront theme.\n• Redesigned product and service layouts and navigation.\n• Improved mobile responsiveness and Add to Cart button alignment.\n• Updated Reviews page with animated seasonal visuals.\n\n━━━━━━━━━━━━━━━━━━━━\n**SHOPPING EXPERIENCE**\nImproved product information, stock displays, and shopping controls. Existing checkout, order management, and customer support remain part of BirdShop.\n\n━━━━━━━━━━━━━━━━━━━━\n**REFERRAL PROGRAM — IN DEVELOPMENT**\n• Personal referral codes and verified customer tracking.\n• Planned post-purchase referral verification.\n• $0.50 rewards for qualifying first purchases, subject to approval.\n• Referral dashboard and reward tracking.\nThese features are not yet fully available.\n\n━━━━━━━━━━━━━━━━━━━━\n**RESELLER MARKETPLACE — IN DEVELOPMENT**\n• Individual reseller storefronts and seller applications.\n• Game-specific product and service listings.\n• Owner-approved trusted seller verification.\n• Seller order management and commissions.\nMarketplace features will launch gradually after testing and approval.\n\n━━━━━━━━━━━━━━━━━━━━\n**WHAT'S NEXT?**\nOur next priorities are completing referrals, continuing marketplace development, and refining the website experience.\n\nThank you for supporting BirdShop.\n**Website:** https://birdshop.store",
                  "color": 0x921027,
                  "url": "https://birdshop.store",
                  "footer": {"text": "BirdShop • Development progress • Availability may vary by rollout"}
              }]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BirdShop-Public-Updates/1.0"
              }
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as res:
                  if res.status not in (200, 204):
                      raise SystemExit("Unexpected Discord response: HTTP " + str(res.status))
          except urllib.error.HTTPError as error:
              raise SystemExit("Discord rejected public announcement: HTTP " + str(error.code))
          except urllib.error.URLError:
              raise SystemExit("Could not reach Discord public webhook.")

          print("Public BirdShop website update successfully delivered.")
          PY
