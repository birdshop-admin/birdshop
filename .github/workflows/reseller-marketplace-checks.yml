name: Independent BirdShop app checks
on:
  push:
    branches: [feat/reseller-marketplace-phase1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:isolation
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
          BIRDSHOP_SITE_URL: http://127.0.0.1:3100
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storefront
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-store-regressions
          path: test-results/
          retention-days: 14
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:marketplace
      - run: npm run test:marketplace
      - run: npm run build:marketplace
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54322
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
          MARKETPLACE_SITE_URL: https://market.birdshop.test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:marketplace:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-browser-evidence
          path: apps/marketplace/test-results/
          retention-days: 14
