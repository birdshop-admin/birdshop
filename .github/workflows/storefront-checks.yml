name: Storefront redesign checks
on:
  push:
    branches: [feat/aer-charcoal-storefront]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-placeholder
          BIRDSHOP_SITE_URL: http://127.0.0.1:3100
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storefront
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-evidence
          path: test-results/
          retention-days: 14
